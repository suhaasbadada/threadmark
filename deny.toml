# Product dependencies are pinned and locked; see docs/progress/phase-2-core.md.
[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT"]
confidence-threshold = 0.95

# Unicode tables used by serde's derive parser; notice must accompany redistribution.
[[licenses.exceptions]]
name = "unicode-ident"
version = "=1.0.27"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
