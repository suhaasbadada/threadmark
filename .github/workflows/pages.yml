name: Site / GitHub Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site_check.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site_check.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check and build static site
        run: python3 scripts/site_check.py --output _site
      - name: Require owner merge of this exact main revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, head = os.environ['REPOSITORY'], os.environ['HEAD_SHA']
          def api(path):
              result = subprocess.run(['gh', 'api', path], check=True,
                                      capture_output=True, text=True, timeout=30)
              return json.loads(result.stdout)
          pulls = api(f'repos/{repo}/commits/{head}/pulls?per_page=100')
          for summary in pulls:
              if summary.get('merge_commit_sha') != head:
                  continue
              pr = api(f"repos/{repo}/pulls/{summary['number']}")
              if (pr.get('merged') and pr.get('merge_commit_sha') == head
                      and pr['base']['ref'] == 'main'
                      and pr['base']['repo']['full_name'] == repo
                      and (pr.get('merged_by') or {}).get('login') == os.environ['OWNER']):
                  print('Exact revision is an owner-merged main PR.')
                  break
          else:
              raise SystemExit('Pages blocked: exact revision needs a repository-owner PR merge.')
          PY
      - name: Upload checked site (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
