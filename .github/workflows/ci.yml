name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Format, lint, tests, docs, smoke and negative test gate
        run: python3 scripts/check.py
      - name: Native companion tests, real core adapter and bundle build (no GUI launch)
        if: runner.os == 'macOS'
        env:
          THREADMARK_CORE_TEST_BINARY: ${{ github.workspace }}/target/debug/threadmark
          THREADMARK_RETAINED_FIXTURES: ${{ github.workspace }}/target/retained-fixtures
          THREADMARK_EXPORT_FIXTURE: ${{ github.workspace }}/target/export-fixtures/export
        run: |
          mkdir -p target/retained-fixtures target/export-fixtures
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          resource=$(xcrun clang -print-resource-dir)
          xcrun clang -std=c11 -Wall -Wextra -Werror -nostdinc -isystem "$resource/include" -isystem "$sdk/usr/include" -isysroot "$sdk" apps/companion/Tests/RetainedReviewFixtures/retained.c -o target/retained-fixtures/retained
          for mode in malformed duplicate oversize unknown partial eof pipeclose idle hold deinit; do
            cp target/retained-fixtures/retained "target/retained-fixtures/retained-$mode"
          done
          xcrun clang -std=c11 -Wall -Wextra -Werror -nostdinc -isystem "$resource/include" -isystem "$sdk/usr/include" -isysroot "$sdk" apps/companion/Tests/ProjectExportFixtures/export.c -o target/export-fixtures/export
          # Bound subprocess/socket pressure on shared runners; every case still
          # runs, including each test's explicit concurrent cancellation races.
          sh apps/companion/scripts/swift.sh test --no-parallel --disable-xctest --enable-swift-testing -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          sh apps/companion/scripts/check-retained-api.sh
          sh apps/companion/scripts/bundle.sh
          plutil -lint apps/companion/dist/Threadmark.app/Contents/Info.plist

  security:
    name: Dependencies, licenses and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisory, license, duplicate and source checks
        run: cargo deny --locked check
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/threadmark-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/threadmark-tools" gitleaks
          echo "$RUNNER_TEMP/threadmark-tools" >> "$GITHUB_PATH"
      - name: Tracked files, history and synthetic scanner failure gate
        run: python3 scripts/secrets.py
