name: Integrated offline experiments
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Integrated experiments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check runner-provided runtimes (no installation)
        run: |
          python3 -B scripts/ci_python.py
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
      - name: Verify selected reviewed Python grammar
        run: |
          "$THREADMARK_PYTHON" -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version); print("native AST grammar:", tuple(sys.version_info[:2]))'
          "$THREADMARK_PYTHON" -B scripts/test_ci_python.py
      - name: Python offline contracts and fixture preparation
        run: |
          "$THREADMARK_PYTHON" -B experiments/extraction/test_harness.py
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/extraction -p test_normalized.py -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/opencode/native -p 'test_*.py' -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/host-isolation -p 'test_*.py' -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-corpus -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-scoring -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-adapter -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-lexical -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-candidate -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-symbol -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-directcall -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-runner -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evaluation-pilot -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evidence-selection -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/evidence-review -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/decision-brief -v
          "$THREADMARK_PYTHON" -B -m unittest discover -s experiments/graphify-comparison -v
      - name: Node offline host and UX contracts
        run: node --test experiments/opencode/contract.test.mjs experiments/opencode/native-journey/kernel.test.mjs experiments/t3-handoff/prepare.test.mjs experiments/ux-walkthrough/model.test.mjs
      - name: Actual synthetic macOS guards (never installed hosts)
        if: runner.os == 'macOS'
        run: |
          "$THREADMARK_PYTHON" -B experiments/host-isolation/harness.py --synthetic-guard
          "$THREADMARK_PYTHON" -B experiments/opencode/native/synthetic_containment.py --synthetic-compiler-guard
