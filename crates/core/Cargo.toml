[package]
name = "threadmark-core"
description = "Threadmark durable scoped lexical knowledge and foundation contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled", "limits"] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
